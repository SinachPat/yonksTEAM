name: Build Release ZIP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-content/themes/yonksteam/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: wp-content/themes/yonksteam

      - name: Build theme assets
        run: npm run build
        working-directory: wp-content/themes/yonksteam

      - name: Create clean ZIP
        run: |
          TAG="${{ github.ref_name }}"
          THEME="wp-content/themes/yonksteam"
          ZIP_NAME="yonksteam-${TAG}.zip"

          cd "$THEME"
          zip -r "/tmp/${ZIP_NAME}" . \
            -x "node_modules/*" \
            -x "src/*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "postcss.config.js" \
            -x "tailwind.config.js" \
            -x ".gitignore"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload ZIP to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: /tmp/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip